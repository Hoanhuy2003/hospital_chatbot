spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_chatbot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
    hikari:
      pool-name: HospitalHikariCP

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.enable_lazy_load_no_trans: true
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh

  # Jackson config cho date/time
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB

server:
  port: 8080
  tomcat:
    # Tomcat 10 / Spring Boot 4: mặc định max-part-count thấp (4.0.3 ≈ 10 part).
    # Form promote có ~10 field + 1 file → dễ vượt → MaxUploadSizeExceededException.
    max-part-count: 100
    max-http-form-post-size: 200MB
    max-swallow-size: 200MB

# URL frontend (để chatbot chèn link đặt khám / chi tiết bác sĩ)
