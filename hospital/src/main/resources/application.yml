spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_chatbot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
    hikari:
      pool-name: TestHikariCP

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.enable_lazy_load_no_trans: true

  # Servlet nằm cùng cấp với datasource và jpa (trong spring)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

# Server nằm ngoài cùng
server:
  port: 8080

# JWT nằm ngoài cùng (Để @Value("${jwt.secretKey}") hoạt động)
jwt:
  secretKey: "unRgKLqmtvb/9icGgNImphNA9WMs5qCVkrQtH4sKV2w="
  expiration: 86400