<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Private Notification - Backend Only</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages { border: 1px solid #ccc; padding: 15px; height: 500px; overflow-y: auto; background: #f9f9f9; }
        .message { margin: 10px 0; padding: 12px; border-radius: 6px; background: #e3f2fd; }
        .info { color: #1976d2; font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>
<h1>🔔 Test Private Notification (Backend Only - Port 8080)</h1>
<p>Trạng thái: <strong id="status">Đang kết nối...</strong></p>
<button onclick="disconnect()">Ngắt kết nối</button>
<hr>
<h3>Thông báo nhận được (Private):</h3>
<div id="messages"></div>

<script>
    let client;

    function connect() {
        client = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws-hospital',   // ← Dùng trực tiếp backend
            reconnectDelay: 5000,
            debug: function(str) {
                console.log(str);
            }
        });

        client.onConnect = function(frame) {
            document.getElementById('status').innerHTML = '✅ Đã kết nối thành công!';
            document.getElementById('status').classList.add('info');
            console.log('Connected to WebSocket');

            // Subscribe Private Notification
            client.subscribe('/user/queue/notifications', function(message) {
                try {
                    const notification = JSON.parse(message.body);
                    console.log('📨 Nhận được thông báo PRIVATE:', notification);

                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message';
                    msgDiv.innerHTML = `
                        <strong>${notification.title}</strong><br>
                        ${notification.message}<br>
                        <small>Loại: ${notification.type} | ${notification.sentAt || ''}</small>
                    `;
                    document.getElementById('messages').appendChild(msgDiv);
                    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
                } catch (e) {
                    console.error('Lỗi parse thông báo:', e);
                }
            });
        };

        client.onStompError = function(frame) {
            document.getElementById('status').innerHTML = '❌ Lỗi STOMP: ' + (frame.headers.message || 'Unknown');
            console.error('STOMP Error:', frame);
        };

        client.onWebSocketError = function(event) {
            document.getElementById('status').innerHTML = '❌ Lỗi kết nối WebSocket';
            console.error('WebSocket Error:', event);
        };

        client.activate();
    }

    function disconnect() {
        if (client) client.deactivate();
    }

    window.onload = connect;
</script>
</body>
</html>
